name: Make signing key

# Run this ONCE, from the Actions tab, if you have no PC to run keytool on.
# It creates an upload key, prints nothing to the log, and leaves the file plus
# its base64 form in the run's Artifacts. Download it, copy the base64 text into
# the repository secret KEYSTORE_BASE64, then delete the artifact.
on:
  workflow_dispatch:
    inputs:
      alias:
        description: 'Key alias'
        required: true
        default: 'upload'
      password:
        description: 'Password for both the store and the key'
        required: true
      dname:
        description: 'Certificate name'
        required: true
        default: 'CN=Feeling The Way, O=Indie, C=JP'

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.jks \
            -alias "${{ github.event.inputs.alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ github.event.inputs.password }}" \
            -keypass "${{ github.event.inputs.password }}" \
            -dname "${{ github.event.inputs.dname }}"
          base64 -w0 release.jks > release.jks.base64.txt
          echo "keystore created"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: KEEP-THIS-SAFE-keystore
          path: |
            release.jks
            release.jks.base64.txt
          retention-days: 1
